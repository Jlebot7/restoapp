<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RestoApp - Módulo de Pedidos para Meseros con Motor PocketFlow Planner-Critic.">
    <title>RestoApp - Toma de Pedidos</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .engine-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }
        .engine-badge.online {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .engine-badge.offline {
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }
        .engine-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .engine-badge.online .engine-dot {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
        .engine-badge.offline .engine-dot {
            background-color: #f59e0b;
        }
        .pipeline-card {
            margin-top: 1rem;
            padding: 0.85rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-sm);
        }
        .pipeline-step {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            color: #334155;
        }
        .step-icon {
            font-weight: bold;
        }
        .step-icon.ok { color: #16a34a; }
        .step-icon.critic { color: #2563eb; }
    </style>
</head>
<body>

    <div id="main-header-placeholder"></div>

    <main class="main-content">
        <header class="page-header">
            <h1 class="page-title">Módulo de Pedidos — Mesero</h1>
            <p class="page-subtitle">Procesamiento de comandas y validación en tiempo real con motor <strong>PocketFlow</strong>.</p>
            <div id="pocketflow-status-container">
                <span id="pocketflow-badge" class="engine-badge offline">
                    <span class="engine-dot"></span>
                    <span id="pocketflow-status-text">Verificando motor PocketFlow...</span>
                </span>
            </div>
        </header>

        <div class="grid-2">

            <section class="card" aria-labelledby="form-title">
                <h2 class="card-title" id="form-title">📝 Datos de la Comanda</h2>
                
                <form id="order-form" novalidate>
                    <div class="form-group">
                        <label for="dish-select" class="form-label">Seleccionar Plato:</label>
                        <select id="dish-select" class="form-select" required>
                            <option value="">-- Cargando catálogo... --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quantity" class="form-label">Cantidad:</label>
                        <input type="number" id="quantity" class="form-control" placeholder="Ej. 2" min="1" step="1" required>
                    </div>

                    <div class="form-group">
                        <label for="unit-price" class="form-label">Precio Unitario ($ COP):</label>
                        <input type="number" id="unit-price" class="form-control" placeholder="0.00" min="0" step="0.01" required>
                    </div>

                    <button type="submit" id="btn-process-order" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                        ⚡ PROCESAR PEDIDO CON POCKETFLOW
                    </button>
                </form>
            </section>


            <section id="order-summary-box" class="card summary-card" style="display: none;" aria-label="Resumen de la orden">

            </section>
        </div>
    </main>

    <script type="module" src="js/pages/pedido.js"></script>
</body>
</html>
